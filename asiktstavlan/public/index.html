<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Åsiktstavlan</title>
  <meta name="description" content="Säg vad du tycker – anonymt. Gilla det du håller med om.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="dot"></span>Åsiktstavlan</a>
    <span class="count" id="count"></span>
  </header>

  <main>
    <section class="hero">
      <h1 id="question">Vad tycker du?</h1>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="text" rows="2" placeholder="Skriv din åsikt…" required></textarea>
        <div class="row">
          <input id="alias" type="text" placeholder="Alias (valfritt)" aria-label="Alias">
          <span class="chars" id="chars"></span>
          <button type="submit" id="send">Skicka</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="rules">Var schysst. Hets, rasism och vulgärt språk granskas och publiceras inte. Inlägg försvinner efter <span id="days">30</span> dagar.</p>
    </section>

    <div class="sortbar" role="tablist" aria-label="Sortering">
      <button class="sort active" data-sort="top" role="tab" aria-selected="true">Populärast</button>
      <button class="sort" data-sort="new" role="tab" aria-selected="false">Nyast</button>
    </div>

    <section id="board" class="board" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>Inga åsikter än – bli först!</p>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
